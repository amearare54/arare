# arare 独自: ジョイスティックを倒した方向でビヘイビアを1回だけ発火させる入力プロセッサ
#
# トラックパッドの3本指スワイプ相当を親指のスティックで行うためのもの。
# 相対移動(REL_X/REL_Y)を方向ごとに積算し、しきい値を超えた瞬間にタップを1回送る。
# 1回はじく＝1回。中央へ戻す（イベントが reset-ms 途切れる）と次が出る。
description: Fire a behavior once per directional flick of an analog stick

compatible: "arare,input-processor-gesture"

include: ip_zero_param.yaml

properties:
  threshold:
    type: int
    default: 40
    description: この量だけ積算したら発火する（相対移動の合計）
  reset-ms:
    type: int
    default: 200
    description: この時間イベントが来なければ積算を捨てて再武装する
  tap-ms:
    type: int
    default: 20
    description: 押してから離すまでの時間
  repeat-ms:
    type: int
    default: 0
    description: >
      同じ向きに倒し続けたとき、この間隔で繰り返す。0 = 繰り返さない（1回はじく＝1回）。
      上（Mission Control）のように開閉が交互になる操作があるので、既定は 0
  bindings:
    type: phandle-array
    required: true
    description: 上・下・左・右の順に4つ指定する
