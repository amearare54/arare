# arare 独自: ジョイスティックを倒した方向でビヘイビアを1回だけ発火させる入力プロセッサ
#
# トラックパッドの3本指スワイプ相当を親指のスティックで行うためのもの。
# 相対移動(REL_X/REL_Y)を方向ごとに積算し、しきい値を超えた瞬間にタップを1回送る。
# 1回はじく＝1回。中央へ戻す（イベントが reset-ms 途切れる）と次が出る。
description: Fire a behavior once per directional flick of an analog stick

compatible: "arare,input-processor-gesture"

include: ip_zero_param.yaml

properties:
  threshold:
    type: int
    default: 40
    description: この量だけ積算したら発火する（相対移動の合計）
  reset-ms:
    type: int
    default: 100
    description: >
      この時間、大きな動き（|値| > min-value）が来なければ、中央へ戻したとみなして再武装する。
      倒している間は約30msごとにレポートが来る。200 だと素早く続けてはじいた2回目以降を
      取りこぼした（実測ログで17回中9回）。80 を切ると倒したままの間に再武装して2回出る恐れがある。
      arare Studio のレイヤー別ノード（joy_gesture_N）は指定しないので、この既定値が効く
  tap-ms:
    type: int
    default: 20
    description: 押してから離すまでの時間
  repeat-ms:
    type: int
    default: 0
    description: >
      同じ向きに倒し続けたとき、この間隔で繰り返す。0 = 繰り返さない（1回はじく＝1回）。
      上（Mission Control）のように開閉が交互になる操作があるので、既定は 0
  min-value:
    type: int
    default: 6
    description: >
      1回のイベントの |値| がこれ以下なら、中央付近の揺れ・中点のずれとして無視する（積算もしない）。
      6 は 1サンプル2（中点からおよそ デッドゾーン+210mV まで）× 1レポート3サンプル。
      はっきりはじくと1レポートで 15〜36 になる
  bindings:
    type: phandle-array
    required: true
    description: 上・下・左・右の順に4つ指定する
