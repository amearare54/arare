manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: nuovotaka
      url-base: https://github.com/nuovotaka
    - name: t-ogura
      url-base: https://github.com/t-ogura
    # ジョイスティック（アナログXY）用
    - name: badjeff
      url-base: https://github.com/badjeff
    # 上流の不具合を直したフォーク（arare 自身のアカウント）
    - name: amearare54
      url-base: https://github.com/amearare54
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # PAW3222 trackball driver.
    # torabo-tsuki branch = main + nRF52 SDIO connect/disconnect power saving
    # (supports spi0/spi1 node labels only — arare_R uses spi1)
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: torabo-tsuki
      path: modules/zmk-driver-paw3222
    # ポインタ加速 input processor（PAW3222で実機テスト済み・ZMK v0.3.0対応）
    - name: zmk-pointing-acceleration-alpha
      remote: nuovotaka
      revision: 780dfcd6b796063367893ff41e233773e12fb07c
      path: modules/zmk-pointing-acceleration
    # ステータスBLEアドバタイズ（ArareHUDレイヤー表示用。v2.2.3タグのSHA。
    # central=右のみ送信・ホスト接続中も継続。manufacturer data 26B: [6]=active_layer）
    - name: prospector-zmk-module
      remote: t-ogura
      revision: 72a71aeea816eb0f86ffc5b108b267076ce5f0af
      path: modules/prospector-zmk-module
    # 左手ジョイスティックのアナログXY。ADCの複数chを1つのinputイベントにまとめる。
    # 作者本人がREADMEで「ポーリング方式のため消費電力が高く無線ビルドには非推奨」と警告しているが、
    # ユーザーが消費電力を承知のうえで採用を決定（2026-09-05）。
    # ZMKバージョン対応の記載はリポジトリに無く、v0.3.0との互換は依存API
    # （input_report / sensor_driver_api / ADC_DT_SPEC_GET_BY_IDX）のソース照合による間接確認のみ。
    # ★2026-09-22 フォーク版に切り替え。上流 2684f22 に1行の修正を足したもの（branch: arare-fix-uint8-loop）。
    #   analog_input.c の `for (uint8_t i = len - 1; i >= 0; i--)` は i >= 0 が常に真で、
    #   全チャネルが前回と同じ（スティック静止）ときに配列の外を読み続け、永久に抜けないことがある。
    #   左手でこれを踏むと左右が繋がらなかった（ジョイスティックを外すと 20/20 で繋がる）。
    #   上流 main でも未修正（2026-09-22 時点）。
    - name: zmk-analog-input-driver
      remote: amearare54
      revision: 81f22641ca430040363b4d6dd569555cb6a2c260
      path: modules/zmk-analog-input-driver
  self:
    path: config
