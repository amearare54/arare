# arare 右手（central・トラックボール側）
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_POINTING=y
CONFIG_PAW3222=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ポインタ加速（arare Studioの加速度設定で使用。チェーン未挿入なら無効）
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_STANDARD=y

# レイヤーHUD（Mac常駐アプリ ArareHUD）向けステータスBLEアドバタイズ
#
# ★2026-09-21 無効化。左右(split)が繋がらない原因がこれだと特定したため。
#   機序（ソースで確認済み）:
#     1. ZMK の split central は Kconfig で `select BT_SCAN_WITH_IDENTITY` される
#        （zmk v0.3.0 app/src/split/bluetooth/Kconfig:22）。スキャンは identity アドレスで行う。
#     2. prospector の広告パラメータには BT_LE_ADV_OPT_USE_IDENTITY が無い
#        （status_advertisement.c:459-463 `.options = 0`）。Zephyr は共有の random address を
#        NRPA に書き換えてしまう。
#     3. その状態で bt_le_scan_start を呼ぶと identity を書き戻せず失敗する。
#     4. ZMK v0.3.0 の central.c:911-916 は bt_le_scan_start の *前* に is_scanning=true を立て、
#        失敗時に false へ戻さずに return する。以後 start_scanning() は 892行目の
#        「Scanning already running」で即 return し、**再起動するまで二度とスキャンしない**。
#   → ホストとは繋がるのに左手を永久に見つけられない、という症状になる。
#   ArareHUD のレイヤー表示はこの間使えない。左右が安定してから戻しかたを検討する。
# CONFIG_ZMK_STATUS_ADVERTISEMENT=y
# CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="arare"

# 電池残量をマイコンのLEDで通知（緑>60%／橙／赤<=20%。常時点灯はしない）
CONFIG_ARARE_BATTERY_LED=y
