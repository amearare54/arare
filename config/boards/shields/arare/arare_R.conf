# arare 右手（central・トラックボール側）
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_POINTING=y
CONFIG_PAW3222=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ポインタ加速（arare Studioの加速度設定で使用。チェーン未挿入なら無効）
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_STANDARD=y

# レイヤーHUD（Mac常駐アプリ ArareHUD）向けステータスBLEアドバタイズ
# central(右)のみ送信。アクティブ時200ms間隔・5秒無操作で30s間隔に自動減速
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="arare"

# 電池残量をマイコンのLEDで通知（緑>60%／橙／赤<=20%。常時点灯はしない）
CONFIG_ARARE_BATTERY_LED=y

# ---- 入力スレッドのスタック（2026-09-22）----
# central（右手）の input スレッドは Zephyr 既定の 512B のまま（ZMK が 1024B に上げるのは peripheral だけ:
# zmk v0.3.0 app/src/pointing/Kconfig「default 1024 if ZMK_SPLIT && !ZMK_SPLIT_ROLE_CENTRAL」）。
# 左手のジョイスティック入力が届くと、joy_gesture（src/input_processor_gesture.c）が input スレッドから
# &kp → キー処理 → HID → USB 送信まで呼ぶので 512B をあふれ、隣の BT RX スレッドのスタックを壊して右手が停止する。
# 停止しても USB は列挙されたまま（HID=2）に見える。同じ症状の先例: beekeeb/zmk-keyboard-toucan PR #19（2048 で解消）。
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# ---- 診断用（diag-R-tb ブランチ限定・main には入れない）----
# ZMK_STUDIO は Studio 用 CDC が無いと使えないので切る。paw32xx は ZMK のログレベルで出る。
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_LOG_LEVEL_DBG=y
