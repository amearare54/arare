# arare 右手（central・トラックボール側）
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_POINTING=y
# ★切り分け用（test-no-trackball ブランチ限定）: トラックボールを丸ごと外す。
#   右手が起動直後に止まって USB に出てこない件が、PAW3222 の SPI 初期化のせいか確かめる。
#   これで右手が安定して USB に出るなら、原因はトラックボール側（モジュール未接続・FFCの向き等）。
# CONFIG_PAW3222=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ポインタ加速（arare Studioの加速度設定で使用。チェーン未挿入なら無効）
CONFIG_ZMK_INPUT_PROCESSOR_ACCELERATION=y
CONFIG_INPUT_PROCESSOR_ACCEL_LEVEL_STANDARD=y

# レイヤーHUD（Mac常駐アプリ ArareHUD）向けステータスBLEアドバタイズ
# central(右)のみ送信。アクティブ時200ms間隔・5秒無操作で30s間隔に自動減速
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="arare"

# 電池残量をマイコンのLEDで通知（緑>60%／橙／赤<=20%。常時点灯はしない）
CONFIG_ARARE_BATTERY_LED=y

# ★診断用（test-notb-log ブランチ限定）
CONFIG_ZMK_LOG_LEVEL_DBG=y
