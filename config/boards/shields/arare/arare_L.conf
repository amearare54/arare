# arare 左手（peripheral）
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y

# 注: ジョイスティックのアナログXY(AIN2/3)は未実装（フェーズ2）。
# ZMK本体のバッテリー計測が SAADC oversampling=4 をハードコードしており、
# analog-input-driver と併用すると約1分でSAADCがハングする既知問題があるため、
# 導入時はZMKフォークでoversampling=0にするか左手の電池報告を諦める必要がある。

# 電池残量をマイコンのLEDで通知（緑>60%／橙／赤<=20%。常時点灯はしない）
CONFIG_ARARE_BATTERY_LED=y
