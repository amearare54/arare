# arare 左手（peripheral）
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_BATTERY_REPORTING=y

# 注: ジョイスティックのアナログXY(AIN2/3)は未実装（フェーズ2）。以下は2026-09-05に一次情報で検証済み。
#
# 理由: nRF52840のSAADCは1つしかなく、電池計測とスティック読みで共有する。
#   ZMKの電池ドライバが adc_sequence.oversampling = 4 をハードコードしていて、
#   デバイスツリーにもKconfigにも変更手段が無い（v0.3.0〜main まで未修正）。
#   ★XIAOが使うのは battery_voltage_divider.c:137。battery_nrf_vddh.c:90 ではない
#     （参考にした badjeff の README は vddh 側を指しているので、そのまま真似ると直らない）。
#   oversampling>0 だとZephyrがSAADCのBURSTを有効化する。スティックは2ch(AIN2/3)のスキャン読みなので、
#   スキャン↔非スキャンの切替でENDイベントが出なくなり、adc_read が K_FOREVER で
#   ADCロックを握ったまま止まる → SAADC利用者が全部停止する。
#   （Zephyr自身が drivers/adc/adc_nrfx_saadc.c のコメントでこの挙動を警告している）
#   ※発生までの時間は不定。以前ここに書いていた「約1分」は一次情報に根拠が無かったので削除。
#   ※この構成(XIAO + voltage_divider + peripheral)での再現報告は見つかっていない。機序からの想定。
#
# 選択肢:
#   A: ZMKをフォークして battery_voltage_divider.c:137 を oversampling=0 にする。
#      電池報告を維持できる。ZMK更新のたび追従が必要。
#      （類似の実例 letmegobacktosleep/zmk は vddh 側しか直していないので流用不可）
#   B: 左手の電池報告を諦める。下の CONFIG_ZMK_BATTERY_REPORTING の行を消すだけで無効になる
#      （強制する既定値が無いことを確認済み）。ただし左手のLED残量表示も効かなくなる。
#   C: 外部ADC(SPI/I2C)でスティックを読む。基板改版が必要。
#   ※Zephyrを3.7以降へ上げる案は効かない見込み。3.7の修正は「未使用チャネルのBURSTを消す」もので、
#     問題のBURSTは選択中チャネル（電池側=SAADC index0）に立っているため。
#
# 別件の懸念: 候補モジュール badjeff/zmk-analog-input-driver は、作者自身がREADMEで
#   「ポーリング方式で消費電力が高く、無線ビルドには非推奨」と警告している。左手は無線peripheral。
#
# 補足: peripheral側からの入力転送そのものは ZMK v0.3.0 で正式サポート（zmk,input-split）。
#   左手にも CONFIG_ZMK_POINTING=y が要る。

# 電池残量をマイコンのLEDで通知（緑>60%／橙／赤<=20%。常時点灯はしない）
CONFIG_ARARE_BATTERY_LED=y

# ---- ジョイスティック（アナログXY: AIN2=D4 / AIN3=D5）2026-09-05 ----
# ユーザーが消費電力の増加を承知のうえで採用（ポーリング方式。加えてスティックの電源は
# XIAO の 3V3 直結でゲート用FETが無く、分圧電流が常時流れる）。
#
# CONFIG_ZMK_POINTING はここに書かない。Kconfig.defconfig が SHIELD_ARARE_L でも
# default y にしている（入力転送 zmk,input-split はこの配下にあるので左手にも必要）。
# CONFIG_INPUT は ZMK_POINTING が、CONFIG_ADC は ANALOG_INPUT が select する。
CONFIG_ANALOG_INPUT=y

# SENSOR を明示する。ドライバは DEVICE_DT_INST_DEFINE に CONFIG_SENSOR_INIT_PRIORITY を
# 使うが、これは Zephyr の drivers/sensor/Kconfig の `if SENSOR` 内にしか定義が無い。
# badjeff の Kconfig は select ADC のみで SENSOR を select しないため、
# エンコーダ構成を変えた瞬間に未定義シンボルで落ちるのを防ぐ。
CONFIG_SENSOR=y

# 無線peripheralなので送信回数を間引く（ミリ秒）。間引いた分の移動量は積算される。
CONFIG_ANALOG_INPUT_REPORT_INTERVAL_MIN=22

# CONFIG_ADC_ASYNC は付けない。ドライバはハンドラ内で待つだけで耐性は上がらず、
# サンプリングタイマが同じ k_work を2つのworkqueueへ submit する経路が増えるだけ。

# ---- 実機で中点mVとフルストロークmVを測るとき「だけ」有効化する（4行セット）----
# CONFIG_ZMK_USB_LOGGING が無いと LOG 自体が無効で1行も出ない（左手はコンソールが無い）。
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ANALOG_INPUT_LOG_LEVEL_DBG=y
# CONFIG_ANALOG_INPUT_LOG_DBG_RAW=y
# CONFIG_ANALOG_INPUT_LOG_DBG_REPORT=y
